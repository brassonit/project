services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: brassonit
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwer1234!!
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app  # 코드 변경 실시간 반영
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_local_data:
server {
    listen 80;
    server_name brassonitent.com www.brassonitent.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name brassonitent.com www.brassonitent.com;

    ssl_certificate /etc/letsencrypt/live/brassonitent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brassonitent.com/privkey.pem;

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
    }
}